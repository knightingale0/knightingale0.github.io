<html>
    <head>
        <title>Duckbox</title>
        <link rel="stylesheet" href="style.css">
        <script src="scripts/game.js"></script></script>
        <script src="scripts/items.js"></script></script>
        <script src="scripts/inventories.js"></script></script>
    </head>

    <body>
        <main>
            <div id="main">
                <div id="field">
                    <div class="thing pond" data-name="pond" style="left: 10%; top: 60%">
                        <img src="images/pond.png">
                    </div>
                    <button onclick="resetAll()">Reset State</button>
                    <div class="thing controls" id="garbage-can">
                        <img src="images/trashcan.png">
                    </div>

                </div>
                <div id="sidebar">
                    <div id="duck-storage">
                        <div class="list-controls">
                            Ducks
                            <!-- <button class="reset" onclick="resetDucks()">clear</button> -->
                            <button onclick="generateNewDuck()">New Duck</button>
                        </div>
                        <div id="duck-list">
                        </div>
                    </div>
                    <div id="item-storage">
                        <div class="list-controls">
                            Food and Inventory
                            <!-- <button class="reset" onclick="resetItems()">clear</button> -->
                            <button onclick="generateHammer()">hammer</button>
                        </div>
                        <div id="item-list">
                        </div>
                    </div>
                </div>
            </div>


        </main>
        <footer>
            <p>by katie and draco</p>
        </footer>
    </body>

            magic duck - magic dust, 
        decoration - later feature
    -->

</html>
